include:
  - ../docker_global_config.umbra.yaml
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - ~/vw-data:/data
      - /etc/ssl:/ssl
    ports:
      - "127.0.0.1:8081:80"
    environment:
      - ROCKET_TLS:'{certs="/ssl/certs/umbra_ca-chain.cert.pem",key="/ssl/private/umbra-blade.key.pem"}'
      - ROCKET_PORT=444
      - DOMAIN=localhost:8081
      - SIGNUPS_ALLOWED=true  
    labels:
      - homepage.group=Administration
      - homepage.name=VaultWarden Password Manager
      - homepage.icon=vaultwarden.png
      - homepage.href=vault.umbra.com
