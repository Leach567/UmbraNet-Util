services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    volumes:
      - ~/ollama-data:/root/.ollama
    # Highlight-start
    ports:
      - "11434:11434"
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"    
    # Highlight-end

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3003:8080" # Note: Changed host port to 3000 to match your UI preferences
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ~/open-webui-data:/app/backend/data
    depends_on:
      - ollama
    labels:
      - homepage.group=Development
      - homepage.name=AI Web UI
      - homepage.icon=open-webui.png
      - homepage.href=http://ai.umbra.com

